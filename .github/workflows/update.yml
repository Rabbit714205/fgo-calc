name: Update FGO Calc

on:
  schedule:
    - cron: "0 4 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/pikaball/fgo-calc.git
          git fetch upstream master

      - name: Merge upstream
        run: |
          git checkout master
          git merge upstream/master --no-edit

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update FGO data
        run: |
          python data.py

      - name: Update CE data
        run: |
          python ce.py

      - name: Commit generated data
        run: |
          git add data/
          git diff --cached --quiet || git commit -m "Update FGO data"

      - name: Push changes
        run: |
          git push origin master
